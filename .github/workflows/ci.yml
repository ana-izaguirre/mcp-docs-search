name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'evals/**'
      - 'scripts/**'
      - 'README.md'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'evals/**'
      - 'scripts/**'
      - 'README.md'
      - 'pyproject.toml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: lint / python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Type check
        run: uv run mypy --strict src/ tests/ evals/ scripts/

      - name: Compile Python sources
        run: uv run python -m compileall src tests evals scripts

  test:
    name: tests (${{ matrix.label }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu
          - os: windows-latest
            label: windows

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests with coverage
        shell: bash
        run: |
          uv run pytest --cov=src/mcp_docs_search --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage.xml').getroot()
          coverage = float(root.attrib.get('line-rate', '0')) * 100
          print(f'coverage={coverage:.1f}%')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('## Coverage summary\n\n')
              fh.write(f'**Overall coverage:** {coverage:.1f}%\n\n')
              fh.write('Generated by pytest-cov for the package under `src/mcp_docs_search`.\n')
          if coverage < 85:
              raise SystemExit(f'Coverage below minimum threshold: {coverage:.1f}% < 85%')
          PY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          disable_search: true
          verbose: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: Smoke test published commands
        run: |
          uv run mcp-docs-search ./docs --db ./ci.db --rebuild
          uv run mcp-docs-search-server --help

      - name: Exercise the live MCP server
        run: uv run python scripts/mcp_smoke.py --db ./ci.db --query "chunking"

  evals:
    name: retrieval evals
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Retrieval quality is a published number. If the harness breaks or the
    # question set stops matching the fixtures, the build says so.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run retrieval evals
        run: uv run python evals/run_evals.py | tee evals-output.txt

      - name: Check the README quotes the measured numbers
        run: |
          measured=$(grep -o 'recall@1: [0-9.]*   recall@3: [0-9.]*' evals-output.txt)
          echo "measured: $measured"
          if ! grep -qF "$measured" README.md; then
            echo "::error::README retrieval numbers are stale."
            echo "README must contain: $measured"
            grep -n 'recall@1' README.md || true
            exit 1
          fi

