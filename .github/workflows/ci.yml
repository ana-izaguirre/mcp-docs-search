name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Type check
        run: uv run mypy --strict src/ tests/

      - name: Run tests
        run: uv run pytest

      - name: Smoke test published commands
        run: |
          uv run mcp-docs-search ./docs --db ./ci.db --rebuild
          uv run mcp-docs-search-server --help